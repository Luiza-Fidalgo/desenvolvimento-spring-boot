spring.application.name=continuum-control
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/continuum}
spring.datasource.username=${DB_USER:continuum}
spring.datasource.password=${POSTGRES_PASSWORD:dev123}

spring.jpa.hibernate.ddl-auto=update

spring.mongodb.uri=${MONGO_URI:mongodb://continuum:dev123@localhost:27018/continuum?authSource=admin}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}

