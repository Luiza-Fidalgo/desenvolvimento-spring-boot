services:
  postgres:
    image: postgres:17
    container_name: continuum-postgres
    environment:
      POSTGRES_DB: continuum
      POSTGRES_USER: continuum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev123}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U continuum -d continuum"]
      interval: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: continuum-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: continuum
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-dev123}
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: continuum-redis
    ports:
      - "127.0.0.1:6380:6379"

  # Somente com --profile app; o compose up normal continua subindo apenas os bancos.
  app:
    profiles: ["app"]
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/continuum
      DB_USER: continuum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev123}
      MONGO_URI: mongodb://continuum:${MONGO_PASSWORD:-dev123}@mongo:27017/continuum?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECURITY_OPERADOR_PASSWORD: ${SECURITY_OPERADOR_PASSWORD:-operador123}
      SECURITY_AGENTE_LOGIN: ${SECURITY_AGENTE_LOGIN:-AG-B8-01}
      SECURITY_AGENTE_PASSWORD: ${SECURITY_AGENTE_PASSWORD:-agente123}
      SECURITY_SUPERVISOR_PASSWORD: ${SECURITY_SUPERVISOR_PASSWORD:-supervisor123}
      SECURITY_ADMIN_PASSWORD: ${SECURITY_ADMIN_PASSWORD:-admin123}
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started

volumes:
  postgres_data:
  mongo_data:
